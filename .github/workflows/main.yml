name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Zip File
        run: |
          unzip -o StoryAI_Phone_Build.zip -d extracted_app
          ls -la extracted_app

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          cd extracted_app
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradlew not found, looking for project structure..."
            find . -maxdepth 2
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryAI-APK
          path: |
            extracted_app/app/build/outputs/apk/debug/*.apk
            extracted_app/**/*.apk
